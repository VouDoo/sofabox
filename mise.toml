# Everything needed to work on this repo (decision 0017).
#   mise install        install the tools below, for this project only
#   mise tasks          list the available commands
#   mise run <task>     run one (extra arguments are passed to Ansible)

# Versions: `latest`, except Ansible pinned to its major version (a new major can remove modules).
# `mise upgrade` updates everything.
[tools]
uv = "latest" # lets mise install the Python tools below
# Ansible and ansible-lint share one environment, so the linter sees Ansible's modules.
"pipx:ansible" = { version = "14", uvx_args = "--with ansible-lint --with-executables-from ansible-core,ansible-lint" }
"pipx:yamllint" = "latest"
shellcheck = "latest"

[env]
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"

[tasks.setup]
description = "Set up this machine: where the box is, secrets (safe to re-run)"
run = "scripts/setup.sh"

[tasks.ping]
description = "Check that the box is reachable over SSH"
run = "ansible box -m ansible.builtin.ping"

[tasks.check]
description = "Dry run: show what deploy would change, without changing anything"
run = "ansible-playbook ansible/site.yml --check --diff --ask-become-pass"

[tasks.deploy]
description = "Apply the configuration to the box"
run = "ansible-playbook ansible/site.yml --diff --ask-become-pass"

[tasks.fetch-backups]
description = "Copy the services' backups from the box to backups/ on this machine"
run = "scripts/fetch-backups.sh"

[tasks.lint]
description = "Check YAML, Ansible and shell scripts"
run = [
  "yamllint .",
  "ansible-lint",
  "find . -name '*.sh' -not -path './.git/*' -not -path './.ansible/*' -exec shellcheck {} +",
]
