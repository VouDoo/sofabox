- name: Create the labwc config folder
  ansible.builtin.file:
    path: "{{ box_home }}/.config/labwc"
    state: directory
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0755"

- name: Configure labwc (rc.xml)
  ansible.builtin.copy:
    src: labwc/rc.xml
    dest: "{{ box_home }}/.config/labwc/rc.xml"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0644"
  notify: Reload labwc

# Chosen in the Fedora installer (decision 0019); labwc doesn't read it by itself.
- name: Read the keyboard layout chosen at the Fedora install
  ansible.builtin.command: localectl status
  register: desktop_localectl
  changed_when: false
  check_mode: false

- name: Give labwc that keyboard layout
  ansible.builtin.template:
    src: labwc-environment.j2
    dest: "{{ box_home }}/.config/labwc/environment"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0644"
  notify: Restart the TV session

- name: Start the background, notifications and screen-off timer with labwc (TV screen only)
  ansible.builtin.template:
    src: labwc-autostart.j2
    dest: "{{ box_home }}/.config/labwc/autostart"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0644"
  notify: Restart the TV session

- name: Create the screen settings folder
  ansible.builtin.file:
    path: "{{ box_home }}/.config/kanshi"
    state: directory
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0755"

- name: Configure the screens (kanshi)
  ansible.builtin.template:
    src: kanshi-config.j2
    dest: "{{ box_home }}/.config/kanshi/config"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0644"
  notify: Reload the screen settings

- name: Create the terminal config folder
  ansible.builtin.file:
    path: "{{ box_home }}/.config/foot"
    state: directory
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0755"

- name: Configure the terminal (foot)
  ansible.builtin.copy:
    src: foot.ini
    dest: "{{ box_home }}/.config/foot/foot.ini"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0644"

- name: Create the folder for the box's shared files
  ansible.builtin.file:
    path: /usr/local/share/sofabox
    state: directory
    mode: "0755"

- name: Install the background image
  ansible.builtin.copy:
    src: background.jpg
    dest: /usr/local/share/sofabox/background.jpg
    mode: "0644"
