- name: Create the folder for the console login settings
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: "0755"

- name: Log in automatically on the first console (decision 0011) as {{ box_user }}
  ansible.builtin.template:
    src: autologin.conf.j2
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    mode: "0644"
  notify: Restart the TV session

# Named zz-… so it runs after every other login script (language, paths…): labwc replaces the shell.
- name: Start labwc when that console logs in
  ansible.builtin.copy:
    src: sofabox-start-labwc.sh
    dest: /etc/profile.d/zz-sofabox-start-labwc.sh
    mode: "0644"
  notify: Restart the TV session
