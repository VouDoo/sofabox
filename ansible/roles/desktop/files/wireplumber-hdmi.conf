# Managed by Ansible (desktop role). Send sound to the TV: start the sound card in its HDMI profile.
# Without this, WirePlumber picks "analog stereo" (the PC's own output), which has a higher priority.
# Profiles can be listed with `pw-dump` (pipewire-utils).
# If sound is on analog anyway: the TV is probably idle or on another input (HDMI audio then
# unavailable). It comes back to HDMI by itself when the TV wakes.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        device.profile = "output:hdmi-stereo"
      }
    }
  }
]
