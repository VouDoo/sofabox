- name: Create the Mealie data folder
  ansible.builtin.file:
    path: "{{ mealie_data_dir }}"
    state: directory
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0750"

- name: Create the folder for the user's containers (Quadlets)
  ansible.builtin.file:
    path: "{{ box_home }}/.config/containers/systemd"
    state: directory
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0755"

- name: Describe the Mealie container (Quadlet)
  ansible.builtin.template:
    src: mealie.container.j2
    dest: "{{ box_home }}/.config/containers/systemd/mealie.container"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0644"
  notify: Restart Mealie

- name: Open Mealie's port in the firewall
  ansible.posix.firewalld:
    port: "{{ mealie_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Apply a changed Mealie service before starting it
  ansible.builtin.meta: flush_handlers

# The systemd module can't reach another user's services, hence the command.
- name: Start Mealie (it also starts at boot)
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl --user --machine={{ box_user }}@ start mealie.service
  changed_when: false

- name: Set up the nightly Mealie backup
  ansible.builtin.import_tasks: backup.yml
