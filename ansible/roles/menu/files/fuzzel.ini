# Managed by Ansible (menu role). The Super-key menu, readable from the couch.
# Grays only: the selection stands out by being lighter, not by colour.
# Medium weight, light text and roomy lines: clear from a few metres away.
[main]
font=Noto Sans:weight=medium:size=48
line-height=72
prompt=""
icons-enabled=no
lines=8
width=30
horizontal-pad=64
vertical-pad=48
inner-pad=24

[colors]
background=1c1c1ef2
text=d1d1d6ff
prompt=8e8e93ff
input=aeaeb2ff
match=ffffffff
selection=48484aff
selection-text=ffffffff
selection-match=ffffffff
border=3a3a3cff

[border]
width=1
radius=24
selection-radius=12
