# Managed by Ansible (base role). Nightly updates, all of them (decision 0013).
# Not "security": Brave's and RPM Fusion's repositories publish no security advisories,
# so a security-only filter would never update the browser or the video driver.
[commands]
upgrade_type = default
download_updates = yes
apply_updates = yes
reboot = when-needed

[emitters]
emit_via = stdio
