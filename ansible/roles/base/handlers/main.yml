- name: Check the SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Reload SSH

- name: Reload the SSH server
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded
  listen: Reload SSH

- name: Restart the updates timer
  ansible.builtin.systemd_service:
    name: dnf5-automatic.timer
    state: restarted
    daemon_reload: true

- name: Apply the battery charge limit
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/battery-charge-limit.conf
  changed_when: true
