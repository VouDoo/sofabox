# Managed by Ansible (videos role). mpv, for videos played from the couch.
fullscreen=yes
# Decode on the GPU (VA-API) when it can, on the CPU otherwise.
hwdec=auto-safe
# Quitting (q, or Super+Q) remembers where the video stopped; opening it again resumes there.
save-position-on-quit=yes
# Load the subtitle files next to the video, even with a longer name (Movie.en.srt for Movie.mkv).
sub-auto=fuzzy
